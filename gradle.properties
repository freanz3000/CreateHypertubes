org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Mod Info
maven_group = com.pedrorok
archives_base_name = create_hypertube-fabric
mod_version = 0.1.1

minecraft_version = 26.3

# Dependencies
# https://fabricmc.net/develop
fabric_loader_version = 0.20.1
